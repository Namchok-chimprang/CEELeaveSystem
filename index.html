<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script>
/* ======== ตั้งค่า 2 บรรทัดนี้ (ดูคู่มือ README) ======== */
const CONFIG = {
  LIFF_ID: '2012143522-ukR26Wyn',
  API_URL: 'https://script.google.com/macros/s/AKfycbw3_32noLnMG70jAMvBRdI6eMaZxZ0FSA9fFPSCuvZAgT3fSa1zmfgTWsBZH21cNIxh/exec',
};
</script>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#18202E; --muted:#5A6476; --line:#D9DFE8;
  --accent:#1E4A86; --accent-ink:#FFFFFF; --band:#152B4E; --band-ink:#EEF3FB; --band-muted:#A9BAD6;
  --sick:#0E7469; --personal:#6A3BC4; --vacation:#B05A06; --ok:#157A3C; --bad:#B42318; --wait:#A16207;
  --display:"Anuphan","Sarabun","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --body:"Sarabun","Leelawadee UI","Thonburi",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F131A; --surface:#171C26; --sunk:#1E2430; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2B3342;
  --accent:#86ADEB; --accent-ink:#0F1A2E; --band:#0B1426; --band-ink:#E6EDF8; --band-muted:#8EA0BF;
  --sick:#3CCFBE; --personal:#B39BFA; --vacation:#F2B054; --ok:#55D88A; --bad:#F7837A; --wait:#F2C94C; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.15rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 10px}
header h1{font-size:1.3rem;font-weight:700}
.who{font-size:.85rem;color:var(--band-muted);text-align:right;line-height:1.3}
.who b{color:var(--band-ink);font-weight:600;display:block}
nav{background:var(--band);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--band-muted);padding:9px 12px 11px;font-family:var(--display);font-weight:600;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--band-ink)}
.tab .count{display:inline-block;margin-left:5px;padding:0 6px;border-radius:99px;background:var(--wait);color:#1b1300;font-size:.75rem;font-family:var(--body)}
main{padding-block:18px calc(48px + env(safe-area-inset-bottom))}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--ink);width:100%;min-width:0;font-size:16px}
input:disabled,select:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row2>*,.row3>*{min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:0;margin:0;padding:0}
.seg legend{font-size:.88rem;color:var(--muted);font-weight:500;margin-bottom:4px;padding:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;text-align:center;cursor:pointer}
.seg label small{font-weight:400;color:var(--muted);font-size:.76rem}
.seg input:checked+label{border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.95rem;line-height:1.3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .btn{flex:1}
.preview{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.preview .big{font-family:var(--display);font-size:1.15rem;font-weight:600}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.warn{color:var(--wait);font-weight:500}
.err{color:var(--bad);font-weight:500}
.t-sick{--tc:var(--sick)} .t-personal{--tc:var(--personal)} .t-vacation{--tc:var(--vacation)}

.ledger{display:flex;flex-direction:column;gap:12px}
.q{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;align-items:center}
.q .nm{font-weight:600;color:var(--tc)}
.bar{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{height:100%;background:var(--tc)}
.bar i.p{background:repeating-linear-gradient(135deg,var(--tc) 0 3px,transparent 3px 6px);opacity:.75}
.q .left{font-size:.85rem;color:var(--muted);white-space:nowrap}
.q .left b{font-family:var(--display);font-size:1.1rem;color:var(--ink)}
.low{color:var(--bad)!important}

.slip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.slip .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.slip .head strong{font-family:var(--display);font-size:1.05rem;font-weight:600}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.st{font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st.pending{color:var(--wait)} .st.approved{color:var(--ok)} .st.rejected,.st.cancelled{color:var(--bad)}
.st.cancelled{color:var(--muted)}
.stamp{font-family:var(--display);font-weight:700;font-size:.9rem;letter-spacing:.05em;padding:1px 10px;border:2.5px solid currentColor;border-radius:6px;transform:rotate(-5deg);white-space:nowrap}
.stamp.approved{color:var(--ok)} .stamp.rejected{color:var(--bad)} .stamp.cancelled{color:var(--muted)}
.reason{margin:0;overflow-wrap:anywhere}
.meta{font-size:.82rem;color:var(--muted)}
.note{font-size:.86rem;padding:6px 10px;border-radius:6px;background:var(--sunk);overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);margin-bottom:4px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.daygrp{display:flex;flex-direction:column;gap:6px}
.daygrp h3{font-size:.95rem;font-weight:600;display:flex;gap:8px;align-items:baseline}
.daygrp h3 small{color:var(--bad);font-family:var(--body);font-weight:500}
.ev{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface));font-size:.92rem}
.ev.pending{background:var(--surface);border:1px dashed var(--tc);border-left:4px solid var(--tc)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{background:var(--sunk);color:var(--muted);font-size:.78rem;font-weight:600}
th:first-child{background:var(--sunk)}
tr:last-child td{border-bottom:0}
th.g{text-align:center;color:var(--tc)}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.bad{background:var(--bad);color:#fff}
</style>
</head>
<body>
<header><div class="wrap"><h1>ใบลาออนไลน์</h1><div class="who" id="who"></div></div></header>
<nav id="nav" hidden><div class="wrap" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="app"><div class="center"><div class="spinner"></div><p class="hint">กำลังเปิด…</p></div></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const TYPES = {sick:{label:'ลาป่วย'}, personal:{label:'ลากิจ'}, vacation:{label:'ลาพักร้อน'}};
const TKEYS = Object.keys(TYPES);
const STATUS = {pending:'รออนุมัติ', approved:'อนุมัติแล้ว', rejected:'ไม่อนุมัติ', cancelled:'ยกเลิก'};
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const thDate = (s, yr=true) => { const d = parse(s); return `${d.getDate()} ${TH_M[d.getMonth()]}${yr ? ' ' + String(d.getFullYear()+543).slice(-2) : ''}`; };
const fmtN = n => String(Math.round(n*2)/2);
const stamp = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/); return m ? thDate(`${m[1]}-${m[2]}-${m[3]}`) + (m[4] ? ' ' + m[4] + ' น.' : '') : esc(s); };
function rangeText(l){
  if (l.start === l.end) return thDate(l.start) + (l.half === 'am' ? ' · ครึ่งเช้า' : l.half === 'pm' ? ' · ครึ่งบ่าย' : '');
  return `${thDate(l.start, l.start.slice(0,4) !== l.end.slice(0,4))} – ${thDate(l.end)}`;
}

const S = { me:null, tab:'req', idToken:null, cache:{}, calYm:null, repYm:null, notes:{} };

/* ---------- เชื่อมต่อ ---------- */
let toastT;
function toast(msg, bad){ const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 5000 : 2600); }

async function api(action, data = {}){
  let res;
  try {
    res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, idToken:S.idToken, ...data}) });
  } catch(e){ throw Object.assign(new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'), {code:'network'}); }
  let j; try { j = await res.json(); } catch(e){ throw Object.assign(new Error('เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ ผู้ดูแลควรตรวจการ Deploy ของ Apps Script'), {code:'server'}); }
  if (!j.ok){
    if (j.code === 'auth') showFatal(j.error, true);
    throw Object.assign(new Error(j.error || 'เกิดข้อผิดพลาด'), {code:j.code});
  }
  return j.data;
}
async function run(btn, fn){
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch(e){ if (e.code !== 'auth') toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}
function showFatal(msg, relogin){
  $('#nav').hidden = true;
  $('#app').innerHTML = `<div class="center"><h2>เปิดระบบไม่สำเร็จ</h2><p class="hint">${esc(msg)}</p>${relogin ? '<button class="btn primary" id="relogin">เข้าสู่ระบบใหม่</button>' : ''}</div>`;
  if (relogin) $('#relogin').onclick = () => { try { liff.logout(); } catch(e){} location.reload(); };
}

async function boot(){
  if (CONFIG.LIFF_ID.startsWith('ใส่') || CONFIG.API_URL.startsWith('ใส่')) return showFatal('ผู้ดูแลยังไม่ได้ใส่ LIFF_ID และ API_URL ในไฟล์ index.html');
  try { await liff.init({ liffId: CONFIG.LIFF_ID }); }
  catch(e){ return showFatal('เริ่ม LIFF ไม่สำเร็จ: ' + (e.message || e)); }
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  S.idToken = liff.getIDToken();
  if (!S.idToken) return showFatal('ไม่ได้รับ ID token — ผู้ดูแลต้องเปิด scope “openid” ในการตั้งค่า LIFF app', true);
  await loadMe();
}
async function loadMe(){
  try { S.me = await api('me'); }
  catch(e){ if (e.code !== 'auth') showFatal(e.message); return; }
  renderShell();
}

/* ---------- โครงหน้า ---------- */
const apprLabel = () => S.me.isApprover ? 'อนุมัติ' : 'ติดตามใบลา';
const roleLabel = m => m.isApprover ? 'หัวหน้า' : m.isSecretary ? 'เลขา/HR' : '';
function tabsFor(){
  const t = [['req','ยื่นลา'],['mine','ใบลาของฉัน'],['cal','ปฏิทิน']];
  if (S.me.canFileForOthers) t.push(['appr', apprLabel()],['staff','พนักงาน'],['rep','สรุป']);
  return t;
}
function renderShell(){
  const m = S.me;
  $('#who').innerHTML = m.registered ? `<b>${esc(m.employee.name)}</b>${roleLabel(m) || esc(m.employee.dept || 'พนักงาน')}` : '';
  if (!m.registered) return renderRegister();
  if (!m.active){ $('#nav').hidden = true; $('#app').innerHTML = `<div class="center"><h2>รอเปิดใช้งาน</h2><p class="hint">ลงทะเบียนเรียบร้อยแล้ว รอเลขา/HR หรือหัวหน้าเปิดใช้งานบัญชีของคุณ แล้วกลับมาเปิดหน้านี้อีกครั้ง</p><button class="btn" id="again">ตรวจสอบอีกครั้ง</button></div>`; $('#again').onclick = loadMe; return; }
  const hash = location.hash.slice(1);
  if (tabsFor().some(([k]) => k === hash)) S.tab = hash;
  if (!tabsFor().some(([k]) => k === S.tab)) S.tab = 'req';
  $('#nav').hidden = false;
  $('#tabs').innerHTML = tabsFor().map(([k,l]) => `<button class="tab" role="tab" data-tab="${k}" id="tab-${k}">${l}</button>`).join('');
  $('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.tab); };
  go(S.tab);
  if (m.canFileForOthers) refreshBadge();
}
function go(tab){
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#app').onclick = $('#app').oninput = null;
  VIEWS[tab]();
  window.scrollTo(0, 0);
}
async function refreshBadge(){
  try { const d = await api('pending'); S.cache.pending = d; setBadge(d.pending.length); } catch(e){}
}
function setBadge(n){ const t = $('#tab-appr'); if (t) t.innerHTML = `${apprLabel()}${n ? `<span class="count num">${n}</span>` : ''}`; }
const loading = () => `<div class="center" style="min-height:30vh"><div class="spinner"></div></div>`;

/* ---------- ลงทะเบียน ---------- */
function renderRegister(){
  $('#nav').hidden = true;
  $('#app').innerHTML = `<form class="panel" id="fReg" novalidate>
    <h2>ลงทะเบียนพนักงาน</h2>
    <p class="hint">${S.me.firstUser ? 'คุณเป็นคนแรกของระบบ จะได้สิทธิ์หัวหน้า (ผู้อนุมัติ) ทันที' : 'หลังลงทะเบียน เลขา/HR จะได้รับแจ้งและเปิดใช้งานบัญชีให้'}</p>
    <label class="f" for="gName">ชื่อ-นามสกุล<input type="text" id="gName" maxlength="80" value="${esc(S.me.lineName)}" autocomplete="name"></label>
    <label class="f" for="gDept">แผนก / สาขา<input type="text" id="gDept" maxlength="60" placeholder="เช่น ครัว, คลังสินค้า"></label>
    <button class="btn primary wide" type="submit" id="gBtn">ลงทะเบียน</button>
  </form>`;
  $('#fReg').onsubmit = e => { e.preventDefault(); run($('#gBtn'), async () => {
    const name = $('#gName').value.trim(); if (!name) return toast('ใส่ชื่อ-นามสกุลก่อน', true);
    S.me = await api('register', {name, dept:$('#gDept').value}); toast('ลงทะเบียนแล้ว'); renderShell();
  }); };
}

/* ---------- ยื่นลา ---------- */
const VIEWS = {};
/* ยื่นในนามของ: ตัวเอง หรือพนักงานที่เลือก (เลขา/หัวหน้า) */
S.forId = '';
function target(){
  if (S.forId && S.me.staff){ const s = S.me.staff.find(x => x.userId === S.forId); if (s) return Object.assign({self:false}, s); }
  return {self:true, userId:S.me.employee.userId, name:S.me.employee.name, quotas:S.me.employee.quotas, usage:S.me.usage};
}
VIEWS.req = () => {
  const m = S.me, today = m.today, others = (m.staff || []).filter(s => s.userId !== m.employee.userId);
  if (S.forId && !others.some(s => s.userId === S.forId)) S.forId = '';
  $('#app').innerHTML = `<div class="stack">
  <form class="panel" id="fReq" novalidate>
    <h2>ยื่นใบลา</h2>
    ${m.canFileForOthers ? `<label class="f" for="rFor">ยื่นในนามของ<select id="rFor"><option value="">ตัวเอง (${esc(m.employee.name)})</option>${others.map(s => `<option value="${esc(s.userId)}"${s.userId === S.forId ? ' selected' : ''}>${esc(s.name)}${s.dept ? ' · ' + esc(s.dept) : ''}</option>`).join('')}</select></label><p class="hint" id="rForHint" hidden></p>` : ''}
    <fieldset class="seg"><legend>ประเภทการลา</legend>

    <button class="btn primary wide" type="submit" id="rBtn">ส่งใบลา</button>
  </form>
  <div class="panel" id="rLedger"></div>
  </div>`;
  const f = $('#fReq');
  f.oninput = f.onchange = e => { if (e && e.target && e.target.id === 'rFor'){ S.forId = e.target.value; drawTarget(); } preview(); };

    S.me = await api('me'); S.cache.mine = null;

};
function drawTarget(){
  const t = target(), m = S.me, w = (x, q) => q ? Math.min(100, x/q*100) : 0;
  TKEYS.forEach(k => $('#rq-' + k).textContent = `สิทธิ์ ${fmtN(t.quotas[k])} วัน`);
  const h = $('#rForHint');
  if (h){ h.hidden = t.self; h.textContent = `ระบบจะแจ้ง ${t.name} ทาง LINE ว่ามีใบลาในชื่อของเขา · ยื่นย้อนหลังได้ไม่เกิน 60 วัน`; }
  $('#rBtn').textContent = t.self ? 'ส่งใบลา' : `ส่งใบลาให้ ${t.name}`;
  $('#rLedger').innerHTML = `<h2>สิทธิ์ลาคงเหลือ${t.self ? '' : 'ของ ' + esc(t.name)} ปี ${m.year + 543}</h2><div class="ledger">${TKEYS.map(k => {
    const q = t.quotas[k], u = t.usage[k], left = q - u.used - u.pending;
    return `<div class="q t-${k}"><span class="nm">${TYPES[k].label}</span><div class="bar"><i style="width:${w(u.used,q)}%"></i><i class="p" style="width:${w(u.pending,q)}%"></i></div><span class="left num"><b class="${left<0?'low':''}">${fmtN(left)}</b> / ${fmtN(q)}</span></div>`;
  }).join('')}</div><p class="hint">แถบทึบ = อนุมัติแล้ว · แถบลาย = รออนุมัติ</p>`;
}
const hset = () => new Set((S.me.holidays || []).map(h => h.date));
function countDays(start, end, half){
  if (!start || !end || end < start) return 0;
  const hs = hset(), wd = d => d.getDay() !== 0 && d.getDay() !== 6 && !hs.has(iso(d));
  if (half !== 'full') return wd(parse(start)) ? 0.5 : 0;
  let n = 0; for (let d = parse(start); iso(d) <= end; d.setDate(d.getDate()+1)) if (wd(d)) n++;
  return n;
}
function reqVals(){
  const start = $('#rStart').value, end = $('#rEnd').value;
  return { type: document.querySelector('input[name=rType]:checked').value, start, end, half: start === end ? $('#rHalf').value : 'full', reason: $('#rReason').value.trim() };
}
function reqCheck(v){
  if (!v.start || !v.end) return {error:'ระบุวันที่ให้ครบ'};
  if (v.end < v.start) return {error:'วันสุดท้ายต้องไม่ก่อนวันเริ่มลา'};
  const days = countDays(v.start, v.end, v.half);
  if (!days) return {error:'ช่วงนี้ไม่มีวันทำงาน (เสาร์-อาทิตย์หรือวันหยุด)'};
  return {days};
}
function preview(){
  const v = reqVals(); $('#rHalf').disabled = v.start !== v.end;
  const c = reqCheck(v), p = $('#rPrev');
  if (c.error){ p.innerHTML = `<span class="err">${esc(c.error)}</span>`; return; }
  const t = target(), q = t.quotas[v.type], u = t.usage[v.type], left = q - u.used - u.pending;
  p.innerHTML = `<span class="big num">${fmtN(c.days)} วันทำการ</span><span class="hint">ไม่นับเสาร์-อาทิตย์และวันหยุดบริษัท</span>` +
    (v.start.slice(0,4) == S.me.year && c.days > left ? `<span class="warn">เกินสิทธิ์${TYPES[v.type].label}คงเหลือ (${fmtN(Math.max(0,left))} วัน) ยังส่งได้ หัวหน้าจะเห็นคำเตือน</span>` : '');
}

    <tr>${TKEYS.map(() => '<th>เดือนนี้</th><th>ทั้งปี</th><th>เหลือ</th>').join('')}</tr></thead>
    <tbody>${d.rows.map(r => `<tr><td>${esc(r.name)}</td>${TKEYS.map(t => `<td>${r.month[t] ? fmtN(r.month[t]) : '–'}</td><td>${fmtN(r.yearUsed[t])}</td><td class="${r.remaining[t]<0?'low':''}">${fmtN(r.remaining[t])}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>` : `<div class="empty"><strong>ยังไม่มีข้อมูล</strong></div>`) +
  `<p class="hint" style="margin-top:10px">นับเฉพาะใบลาที่อนุมัติแล้ว เป็นวันทำการ · “ทั้งปี” คือปี ${y+543}</p>
   <p class="hint">ข้อมูลทั้งหมดอยู่ใน Google Sheet ดาวน์โหลดเป็น Excel ได้จากเมนู ไฟล์ › ดาวน์โหลด<br><a href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">เปิด Google Sheet</a></p>`;
};

boot();
</script>
</body>
